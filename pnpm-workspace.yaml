packages:
  - 'packages/*'
  - 'apps/*'
  # Stand-ins for a customer's own system and a customer's own agent.
  # In the workspace so a clean clone can run the dogfood tests, and
  # held to one rule by packages/mcp/test/external.test.ts: nothing in
  # here may import anything from RigorRun.
  - 'fixtures/external/*'

# Install must stay script-free and non-interactive so `pnpm install` works
# identically on a clean clone and in CI. esbuild's postinstall only re-verifies
# the platform binary pnpm already installed as an optional dependency.
allowBuilds:
  esbuild: false
  # Astro pulls sharp in for its default image service. `apps/site` uses the
  # passthrough service instead — every image on the site is an SVG or a PNG
  # rendered ahead of time by scripts/build-brand.mjs — so sharp's native build
  # would be compiled and then never called. Denied rather than left unanswered,
  # so `pnpm install` neither runs a script nor stops to ask.
  sharp: false
  workerd: true
  '@tailwindcss/oxide': true

minimumReleaseAgeExclude:
  - hono@4.13.7
