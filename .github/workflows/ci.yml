# RigorRun CI.
#
# Everything here runs on the free GitHub-hosted runners with no external
# service, no API key and no credential of any kind. The benchmark gate uses the
# offline demo agents, which is the point: a reliability gate that needs a paid
# API to run is a gate teams switch off.
name: CI

on:
  push:
    # This said [main] while the default branch is master, so every job here
    # ran only on pull requests and nothing checked a merge.
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters. Everything in `verify` measures whether RigorRun
  # works on material that ships inside RigorRun; this measures whether a
  # stranger can use it. If only the technical gates pass, the release is not
  # green — see docs/PRODUCT_REALITY_AUDIT.md for why that distinction had to
  # be made explicit.
  product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:web

      - name: A stranger connects their own system and their own agent
        run: pnpm e2e:external

      # The other half of the same promise. The fresh-user suite reloads the
      # page; this kills the process holding the state and starts it again,
      # then damages a project file on purpose to check RigorRun says so rather
      # than quietly forgetting somebody's afternoon.
      - name: Their work survives the runner being killed
        run: pnpm e2e:restart

      # The browser lane needs a browser, and Playwright is an optional peer
      # everywhere else on purpose. Installed here rather than depended on, so
      # `npx rigorrun` stays a small download for everybody who never uses it.
      - name: A browser environment, which needs a browser
        run: |
          pnpm add -w -D playwright-core
          pnpm exec playwright install --with-deps chromium
          pnpm vitest run packages/env-browser packages/daemon/test/browserProject.test.ts

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-user-run
          path: |
            docs/external-user-run/
            test-results/
          retention-days: 7

  # The package a stranger would install, checked before it can be published.
  # Everything here has burned somebody somewhere: a tarball with sources in
  # it, a bundle that crashes on its first dynamic require, a package that
  # works in the monorepo and nowhere else.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: The published package installs clean and works
        run: pnpm verify:package

      - name: The tarball
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rigorrun-tarball
          path: dist/*.tgz
          retention-days: 7

  # What a stranger's `npm install` pulls in, checked on every change rather
  # than only at release. An advisory that lands on a Tuesday should not wait
  # for somebody to decide to publish.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Reported, not fatal. A high in a transitive dependency with no patch
      # available is a decision for a person, and a gate that blocks on it is a
      # gate somebody switches off.
      - name: Advisories
        continue-on-error: true
        run: pnpm audit --prod

      - name: No credentials in the tree
        run: pnpm vitest run packages/cli/test/security.test.ts

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generic core stays generic
        run: pnpm domain

      - name: Typecheck
        run: pnpm typecheck

      # Before the unit suite, not after it. `pnpm test` includes the browser
      # environment tests, and those assert they are actually driving a browser
      # rather than quietly skipping — which is the right assertion and means
      # they fail outright when playwright-core is absent. This step used to sit
      # below them, so `pnpm test` could not pass in CI at all. Nobody saw it
      # because this workflow was wired to a branch that does not exist here.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Unit and integration tests
        run: pnpm test

      # Standard library only, so there is nothing to install.
      - name: The Python SDK speaks the protocol
        run: python3 -m unittest discover -s sdk/python/tests

      - name: Build
        run: pnpm build

      - name: Design token contrast
        run: pnpm contrast

      - name: End-to-end tests
        run: pnpm e2e

      - name: Accessibility (WCAG A/AA)
        run: pnpm a11y

      - name: Visual regression
        run: pnpm visual

      # The /proof page is generated from real runs. It was regenerated only by
      # `release:verify`, which CI did not run, so it drifted behind HEAD while
      # being presented as evidence. Regenerating here and failing on a diff
      # means the page is either current or the build is red.
      - name: The evidence page still matches what the pipeline produces
        # --check compares what the pipeline found, not when it was run. The
        # previous form diffed the whole file, three of whose fields are a
        # clock, so it could never pass.
        run: node scripts/build-proof.mjs --check

      - name: Cross-browser critical path
        run: pnpm cross

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  benchmark-gate:
    # Proves two things about the committed benchmark, and deliberately not a
    # third. That the suite is satisfiable at all: the reference implementation,
    # which is handed the answer, passes. And that the suite discriminates: an
    # agent that follows the work order without checking anything fails.
    #
    # It does NOT prove that a good agent passes. Both shipped demo agents
    # currently fail this benchmark, and the gate says so rather than pretending
    # otherwise. See docs/PRODUCT_REALITY_AUDIT.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The suite is satisfiable (reference must pass)
        run: pnpm rigorrun gate examples/refund-workflow/benchmark.json --agent reference --allow-reference --quiet

      - name: The suite discriminates (naive agent must fail)
        run: |
          set +e
          pnpm rigorrun gate examples/refund-workflow/benchmark.json --agent naive --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 from the naive agent, got $code"
            exit 1
          fi
          echo "The naive agent failed the gate, as it should."
