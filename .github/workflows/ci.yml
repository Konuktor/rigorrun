# RigorRun CI.
#
# Everything here runs on the free GitHub-hosted runners with no external
# service, no API key and no credential of any kind. The benchmark gate uses the
# offline demo agents, which is the point: a reliability gate that needs a paid
# API to run is a gate teams switch off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generic core stays generic
        run: pnpm domain

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Design token contrast
        run: pnpm contrast

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm e2e

      - name: Accessibility (WCAG A/AA)
        run: pnpm a11y

      - name: Visual regression
        run: pnpm visual

      - name: Cross-browser critical path
        run: pnpm cross

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  benchmark-gate:
    # Proves two things about the committed benchmark, and deliberately not a
    # third. That the suite is satisfiable at all: the reference implementation,
    # which is handed the answer, passes. And that the suite discriminates: an
    # agent that follows the work order without checking anything fails.
    #
    # It does NOT prove that a good agent passes. Both shipped demo agents
    # currently fail this benchmark, and the gate says so rather than pretending
    # otherwise. See docs/PRODUCT_REALITY_AUDIT.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The suite is satisfiable (reference must pass)
        run: pnpm rigorrun gate examples/refund-workflow/benchmark.json --agent reference --quiet

      - name: The suite discriminates (naive agent must fail)
        run: |
          set +e
          pnpm rigorrun gate examples/refund-workflow/benchmark.json --agent naive --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 from the naive agent, got $code"
            exit 1
          fi
          echo "The naive agent failed the gate, as it should."
